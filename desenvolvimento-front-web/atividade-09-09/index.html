<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Paciente</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">
    <header class="page-header">
      <h1>Cadastro de Pacientes</h1>
      <p class="subtitle">Preencha os dados abaixo para registrar um novo paciente</p>
    </header>

    <div class="layout">

      <section class="card form-card">
        <form id="formPaciente">
          <div class="field full">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite o nome do paciente" required>
          </div>

          <div class="field">
            <label for="dataNascimento">Data de nascimento</label>
            <input type="date" id="dataNascimento" name="dataNascimento" required>
          </div>

          <div class="field">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
          </div>

          <div class="field">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
          </div>

          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="exemplo@email.com">
          </div>

          <div class="field">
            <label for="sexo">Sexo</label>
            <select id="sexo" name="sexo" required>
              <option value="">Selecione</option>
              <option value="feminino">Feminino</option>
              <option value="masculino">Masculino</option>
              <option value="outro">Outro</option>
            </select>
          </div>

          <div class="field">
            <label for="convenio">Possui convênio?</label>
            <select id="convenio" name="convenio">
              <option value="nao">Não</option>
              <option value="sim">Sim</option>
            </select>
          </div>

          <div class="field full">
            <label for="observacoes">Observações</label>
            <textarea id="observacoes" name="observacoes" rows="3" placeholder="Alergias, doenças, etc."></textarea>
          </div>

          <button type="submit" class="full">Cadastrar paciente</button>
        </form>

        <div id="mensagem"></div>
      </section>

      <section class="card list-card">
        <div class="list-card-header">
          <h2>Pacientes cadastrados</h2>
          <span class="badge-count" id="contador">0</span>
        </div>

        <ul id="listaPacientes"></ul>
        <p id="listaVazia" class="empty-state">Nenhum paciente cadastrado ainda.</p>
      </section>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
